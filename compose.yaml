services:
  frontend: 
      build: 
        context: ./client
      image: frontend:v1
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - /etc/letsencrypt:/etc/letsencrypt:ro
      depends_on:
        -  backend 
  backend:
    build:
      context: .
    image: backend:v1
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    ports:
      - "3006:3006"
    depends_on:
      -  mongodb
  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb:/data/db
    restart: always

volumes:
   mongodb:

